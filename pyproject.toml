# 项目配置：ruff 静态检查（lint 规则见下方）+ pytest 集中配置
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E4/E7/E9 基础风格与语法、F 未使用/未定义、I 导入排序、UP pyupgrade、B bugbear
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
